name: Release validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  science-and-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AI_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-ai.txt openpyxl==3.1.5
      - run: python -m unittest discover -s pipeline -p 'test_*.py' -v
      - run: python scripts/verify-release-data.py
      - run: python -m pytest backend/tests -q
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_ENABLED: 'false'
      FIRETRACE_PYTHON: ${{ github.workspace }}/backend/.venv/bin/python
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m venv backend/.venv
      - run: backend/.venv/bin/python -m pip install -r backend/requirements-ai.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run e2e:evidence
      - run: npm run e2e:trace
      - run: npm run e2e:integration
      - run: npm run e2e:qa
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: browser-evidence
          path: |
            test-results/
            docs/evidence/integration/*.png
            docs/evidence/local-qa/*.png
          retention-days: 7
